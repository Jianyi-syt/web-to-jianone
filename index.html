<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到我的网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 40px 60px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 42px;
            color: #2d3748;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #4a5568;
            line-height: 1.8;
        }
        .test-notice {
            margin-top:20px;
            color:#e67e22;
            font-weight: bold;
        }
        .tip {
            margin-top: 30px;
            font-size: 14px;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 欢迎来到我的网站</h1>
        <p>你好！很高兴你访问这里。<br>
        这是我的个人网站，后续会不断更新内容。</p>
        <p class="test-notice">现用于测试，网站内容还在搭建完善中，敬请期待！</p>
        <p class="tip">Made with HTML | 托管在 GitHub Pages</p>
    </div>
</body>
</html>
