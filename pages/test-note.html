    <script id="language-controller">
      (() => {
        const buttons = document.querySelectorAll("[data-language]");
        const sessionKey = "jianone-current-language";
        const internalLinks = [...document.querySelectorAll("a[href]")]
          .filter((a) => /^\.\.?\//.test(a.getAttribute("href")))
          .map((a) => ({ element: a, original: a.getAttribute("href") }));
        function setLanguage(language) {
          language = language === "en" ? "en" : "zh";
          const english = language === "en";
          document.documentElement.lang = english ? "en" : "zh-CN";
          document
            .querySelectorAll("[data-i18n-en]")
            .forEach(
              (e) => (e.textContent = e.getAttribute(english ? "data-i18n-en" : "data-i18n-zh")),
            );
          document
            .querySelectorAll("[data-en-alt]")
            .forEach((e) => (e.alt = e.getAttribute(english ? "data-en-alt" : "data-zh-alt")));
          document
            .querySelectorAll("[data-en-aria]")
            .forEach((e) =>
              e.setAttribute(
                "aria-label",
                e.getAttribute(english ? "data-en-aria" : "data-zh-aria"),
              ),
            );
          const description = document.querySelector('meta[name="description"]');
          description.content = description.getAttribute(
            english ? "data-en-content" : "data-zh-content",
          );
          buttons.forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.language === language)),
          );
          internalLinks.forEach(({ element, original }) => {
            const hashIndex = original.indexOf("#");
            const hash = hashIndex < 0 ? "" : original.slice(hashIndex);
            const address = hashIndex < 0 ? original : original.slice(0, hashIndex);
            const [pathname, search = ""] = address.split("?");
            const params = new URLSearchParams(search);
            params.set("lang", language);
            element.setAttribute("href", pathname + "?" + params.toString() + hash);
          });
          try {
            sessionStorage.setItem(sessionKey, language);
          } catch {}
        }
        buttons.forEach((b) =>
          b.addEventListener("click", () => {
            setLanguage(b.dataset.language);
            try {
              const url = new URL(location.href);
              url.searchParams.set("lang", b.dataset.language);
              history.replaceState(null, "", url);
            } catch {}
          }),
        );
        let initial = "zh";
        const requested = new URLSearchParams(location.search).get("lang");
        if (requested === "en" || requested === "zh") initial = requested;
        if (performance.getEntriesByType("navigation")[0]?.type === "reload") {
          try {
            const saved = sessionStorage.getItem(sessionKey);
            if (saved === "en" || saved === "zh") initial = saved;
          } catch {}
        }
        setLanguage(initial);
        window.addEventListener("pageshow", (event) => {
          if (event.persisted) {
            let saved = document.documentElement.lang === "en" ? "en" : "zh";
            try {
              saved = sessionStorage.getItem(sessionKey) || saved;
            } catch {}
            setLanguage(saved);
          }
        });
      })();
    </script>
